<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homeward Bound Days</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Open Sans',sans-serif;
  color:#2F3A4A;
  background:linear-gradient(180deg,#EAF4FB 0%,#fff 100%);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:34px 18px 70px;
}

.hero{
  background:linear-gradient(135deg,#ffffff 0%,#F5FAFD 60%,#F7DDE2 100%);
  border-radius:28px;
  padding:42px 26px;
  text-align:center;
  box-shadow:0 12px 30px rgba(47,58,74,.08);
}

.kicker{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:800;
  color:#92A1C3;
}

h1{
  font-family:'Quicksand',sans-serif;
  font-size:46px;
  margin:12px 0;
  color:#2F3A4A;
}

.sub{
  max-width:720px;
  margin:0 auto 22px;
  line-height:1.6;
  color:#637083;
}

.pills{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.pill{
  background:#fff;
  border-radius:999px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
  box-shadow:0 5px 14px rgba(47,58,74,.08);
}

.day-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:28px;
  justify-content:center;
  background:#fff;
  border-radius:999px;
  padding:12px;
  box-shadow:0 8px 20px rgba(47,58,74,.06);
}

.day-buttons button,
.nav button{
  border:0;
  background:#F5FAFD;
  border-radius:999px;
  padding:10px 15px;
  font-weight:800;
  color:#2F3A4A;
  cursor:pointer;
}

.day-buttons button.active{
  background:#D7C9E8;
}

.day-card{
  display:none;
  background:#fff;
  border-radius:24px;
  margin-top:24px;
  padding:28px;
  box-shadow:0 10px 26px rgba(47,58,74,.08);
}

.day-card.active{
  display:block;
}

.day-label{
  color:#E7B7C8;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:13px;
}

.route{
  font-family:'Quicksand',sans-serif;
  font-size:34px;
  font-weight:700;
  margin:8px 0;
}

.theme{
  font-weight:800;
  margin-bottom:16px;
}

.detail{
  line-height:1.65;
  color:#526070;
}

.boxes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:20px;
}

.box{
  border:1px solid #E7EDF5;
  border-radius:18px;
  padding:18px;
  background:#FCFDFF;
}

.box h3{
  margin:0 0 8px;
  font-size:16px;
}

.nav{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:24px;
}

.nav button{
  background:#fff;
  box-shadow:0 8px 18px rgba(47,58,74,.12);
}

@media(max-width:700px){
  h1{font-size:36px}
  .route{font-size:28px}
  .boxes{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap" id="top">

<section class="hero">
  <div class="kicker">Homeward Bound · The Grand Adventure</div>
  <h1>Carrying the Adventure Home</h1>
  <p class="sub">
    The return trip is quieter, wider, and more reflective — Yosemite, Zion, condors, cowboy memories, family, and the long road back to Goldsboro.
  </p>
  <div class="pills">
    <span class="pill">🏞️ Yosemite</span>
    <span class="pill">🦅 Condor Day</span>
    <span class="pill">🤠 Cowboy Day</span>
    <span class="pill">💛 Perry Family Stop</span>
  </div>
</section>

<div class="day-buttons" id="dayButtons"></div>

<section id="dayContainer"></section>

<div class="nav">
  <button onclick="prevDay()">← Previous Day</button>
  <button onclick="goTop()">↑ Top</button>
  <button onclick="nextDay()">Next Day →</button>
</div>

</div>

<script>
const days = [
  ["Day 1","Buena Park → Oakhurst","Setting up Yosemite","A transition day from California fun into mountain country, ending near Yosemite so the next day can stay calmer.","Drive from Buena Park","Hampton Inn Oakhurst-Yosemite","This is a positioning day. Keep expectations simple and arrive ready for Yosemite."],
  ["Day 2","Yosemite → Tehachapi","Cane-friendly wonder","A gentle Yosemite day focused on big views without overdoing the walking.","Tunnel View / Bridalveil Fall / Base Camp Eatery","Hampton Inn Tehachapi","Use the America the Beautiful Lifetime Senior Pass. Bridalveil Fall, not Yosemite Falls."],
  ["Day 3","Tehachapi → Las Vegas","Transit and lights","A practical drive day with a low-effort evening look at the Las Vegas Strip from the car.","Drive to Las Vegas Red Rock area","Hampton Inn & Suites Las Vegas Red Rock","Stay in the car for the Strip drive. No walking, parking, or downtown chaos."],
  ["Day 4","Las Vegas → Page via Zion","The scenic road east","A beautiful drive through Zion-Mount Carmel Highway, traveling west to east for the preferred view.","Zion-Mount Carmel Highway","Hampton Inn & Suites Page - Lake Powell","Treat Zion as a drive-through scenic experience, not a hiking day."],
  ["Day 5","Condor Day: Page → Navajo Bridge → Page","Looking for wings over the canyon","A quieter day built around Navajo Bridge, binoculars, and the hope of seeing condors.","Navajo Bridge / Marble Canyon area","Page again","Flat, cane-friendly pedestrian bridge. Bring binoculars. Lunch near Marble Canyon Lodge."],
  ["Day 6","Page → Albuquerque","Culture and desert distance","A longer travel day with Acoma Pueblo / Sky City as the flexible cultural anchor.","Acoma Pueblo / Sky City Cultural Center","Hampton Inn Albuquerque area","The cultural center is enough. Guided tour only if energy and walking allow."],
  ["Day 7","Albuquerque → Trinidad","Bonus Colorado day","A scenic positioning day with the option for Capulin Volcano if the day feels easy.","Optional Capulin Volcano","Hampton Inn Trinidad","This is a bonus state day. Keep it flexible."],
  ["Day 8","Trinidad → Dodge City","Maverick Cowboy Day","The plains begin, and Dodge City becomes the perfect cowboy memory day.","Boot Hill Museum","Hampton Inn & Suites Dodge City","Maverick’s cowboy outfit belongs here. This is his day."],
  ["Day 9","Dodge City → Little Rock","The long push","A practical, longer driving day. Wichita is only the turn point, not a stop.","Drive through / turn south near Wichita","Hampton Inn Little Rock area","This is a get-there day. Keep stops simple."],
  ["Day 10","Little Rock → Nashville","Recovery and repositioning","A steadier day toward Tennessee, with Nashville kept simple and away from downtown chaos.","Drive to Nashville area","Hampton Inn Nashville area","Choose easy access over sightseeing. This is a recovery/positioning day."],
  ["Day 11","Nashville → Perry","A meaningful family stop","The road shifts from travel plan to family story, with Perry becoming an emotional anchor.","Drive to Perry, Georgia","Hampton Inn Perry","This stop matters because family is part of the reason for the route."],
  ["Day 12","Perry → Goldsboro","The final stretch home","The last day brings the trip back to where it began — full circle, with stories to carry home.","Drive from Perry to Goldsboro","Home","Final stretch. No big sightseeing needed. Just home."]
];

let current = 0;

function buildDays(){
  const buttons = document.getElementById("dayButtons");
  const container = document.getElementById("dayContainer");

  days.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d[0];
    b.onclick=()=>showDay(i);
    buttons.appendChild(b);

    const card=document.createElement("div");
    card.className="day-card";
    card.innerHTML=`
      <div class="day-label">${d[0]}</div>
      <div class="route">${d[1]}</div>
      <div class="theme">${d[2]}</div>
      <div class="detail">${d[3]}</div>
      <div class="boxes">
        <div class="box"><h3>Drive / Stop</h3><p><strong>${d[4]}</strong></p></div>
        <div class="box"><h3>Stay / Anchor</h3><p><strong>${d[5]}</strong></p></div>
        <div class="box"><h3>What to know</h3><p>${d[6]}</p></div>
        <div class="box"><h3>Memory prompt</h3><p>What part of today felt like something we’ll talk about later?</p></div>
      </div>`;
    container.appendChild(card);
  });

  showDay(0);
}

function showDay(i){
  current=i;
  document.querySelectorAll(".day-card").forEach(c=>c.classList.remove("active"));
  document.querySelectorAll(".day-buttons button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".day-card")[i].classList.add("active");
  document.querySelectorAll(".day-buttons button")[i].classList.add("active");
}

function nextDay(){ if(current < days.length-1) showDay(current+1); }
function prevDay(){ if(current > 0) showDay(current-1); }
function goTop(){ document.getElementById("top").scrollIntoView({behavior:"smooth"}); }

buildDays();
</script>

</body>
</html>
